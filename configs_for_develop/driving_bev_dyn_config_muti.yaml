          json_dir: "od_occ_group/huiquyang/data/Obstacle_3DModelResult_odom_undis_option_new", # relative to ENV_GPAL_NEURAL_NETWORK_WORKDIRS_ROOT
          middle_json_str: "3d_detection_json",

