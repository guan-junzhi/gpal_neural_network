image_per_gpu: 12
workers_per_gpu: 12
skip_sanity_check: true
max_iterations: 50000
save_every_n_iterations: 500
iteration_based_lr_schedulers: true
check_val_every_n_epoch: 1000000
dump_calibset: false

Train:
  EPOCH_LEN: 150000
  CLIP_LENGTH: [5, 25]
  log_every: 10
  visualize_every: 200
  max_visu_img_num: 6
  optimizer: {type: AdamW, lr: 1.0e-06, weight_decay: 1.0e-06}
  lr_scheduler: {type: GradualWarmupScheduler, multiplier: 100, warmup_iterations: 50,
    after_scheduler: CosineAnnealingLR, T_max: 60000}

Test:
  visulization: True

Backbones:
  backbone0:
    type: HENet
    ampfp16: true
    # load: all
    # freeze: all
    in_channels: 3
    input_source: ['img_front_120', 'img_front_30', 'img_back', 'img_front_left', 'img_front_right', 'img_rear_left', 'img_rear_right']
    block_nums: [4, 3, 8, 6]
    block_cls: ["GroupDWCB", "GroupDWCB", "AltDWCB", "DWCB"]
    embed_dims: [64, 128, 192, 384]
    attention_block_num: [0, 0, 0, 0]
    mlp_ratios: [2, 2, 2, 3]
    mlp_ratio_attn: 2
    act_layer: ["nn.GELU", "nn.GELU", "nn.GELU", "nn.GELU"]
    use_layer_scale: [True, True, True, True]
    extra_act: [False, False, False, False]
    down_cls: ["S2DDown", "S2DDown", "S2DDown", "None"]
    patch_embed: "origin"
    stage_out_norm: True
    need_neck: False
    pretrained: '/data/ai_group/workdirs/od_occ_group/huiquyang/codes/gpal_neural_network/henet_initialized.pth'
    strict_load: False
  backbone1:
    type: Point_Feature_Net
    input_source: ['points']
    point_process_config:
      pc_range: [-51.2, -30.72, -1.0, 102.4, 30.72, 5.0]
      voxel_size: [0.32, 0.32, 6]
      max_voxels_num: [30000, 40000]
      max_points_in_voxel: 20
      norm_range: [-51.2, -30.72, -1.0, 102.4, 30.72, 5.0]
      norm_dims: [0, 1, 2]
    reader_config:
      num_input_features: 6
      num_filters: [64,]
      with_distance: False
      pool_size: [20,1]
      voxel_size: [0.32, 0.32, 6]
      pc_range: [-51.2, -30.72, -1.0, 102.4, 30.72, 5.0]
      quantize: True
      use_4dim: True
      use_conv: True
      hw_reverse: True
      normalize_xyz: False
    scatter_config:
      num_input_features: 64
      use_horizon_pillar_scatter: True


  
Groups:
  group0: {load: all, freeze: all, type: DummyBackbone, input_source: backbone0}
  group1: {load: all, freeze: all, type: DummyBackbone, input_source: backbone1}


# Necks:
#   neck0: 
#     type: MMFPN
#     input_source: group0
#     load: all
#     # freeze: all
#     in_strides: [8, 16, 32]
#     in_channels: [128, 192, 384]
#     out_strides: [8, 16, 32]
#     fix_out_channel: 128

Necks:
  neck0: 
    type: FPN
    input_source: group0
    load: all
    # freeze: all
    in_strides: [32]
    in_channels: [384]
    out_strides: [32]
    out_channels: [128]
  neck1: 
    type: SECONDNeck
    input_source: group1
    load: all
    # freeze: all
    in_feature_channel: 64
    down_layer_nums: [3, 5, 5]
    down_layer_strides: [2, 2, 2]
    down_layer_channels: [64, 128, 256]
    up_layer_strides: [0.5, 1, 2]
    up_layer_channels: [128, 128, 128]
    quantize: False
    use_relu6: False


Transformer:
  type: SingleBevFormerViewTransformer
  load: all
  # freeze: all
  transformer_config:
    task_name: DRIVING_BEV_DYN
    pc_range: [-51.2, -30.72, -1.0, 102.4, 30.72, 5.0]
    num_points_in_pillar: 4
    bev_y: 48
    bev_x: 120
    embed_dims: 128
    queue_length: 1
    max_camoverlap_num: 4
    numcam: 7
    single_bev: true
    use_lidar2img: false
    bev_map_voxel_size: [1.28, 1.28, 1.5]
    

Tasks:
  DRIVING_BEV_DYN:
    # batch_size: 12
    # num_worker_limit: 2
    use_concat_dataset: true
    SWITCH_SUBTASK: DRIVING_BEV_DYN
    load: all
    # freeze: all
    amp_scaler: {type: AMPScaler, init_scale: 128.0, growth_interval: 999999999, backoff_factor: 0.99999}
    cam_used: ['ipm']
    transformer: transformer
    frequency: 1.0
    grad_bounds: 3.0
    weight: 1.0
    backbone_feat_id: [2]
    group_feat_id: [1, 2, 3]
    neck_feat_id: [0]
    backbone: backbone0
    group: group0
    neck: neck0
    bev_channels: 256
    # PreProcessing:
    class_dict:
        1: [vehicle_car]
        2: [vehicle_truck]
        3: [vehicle_construction_vehicle]
        4: [vehicle_cyclist]
        5: [vehicle_tricycle]
        6: [human_pedestrian]

    image_crop_config:
      "IMAGE_RESIZE": [540, 960]
      "IMAGE_CROP_H_LEN": 512
      "IMAGE_CROP_SIZE": [512, 960]
      "CROP_HeSai_ID4":
        "SCALE": [4, 4, 2, 2, 2, 2, 2]
        "CROP_START": [28, 28, 28, 28, 28, 28, 28]
        "CROP_START_SKYWELL": [28, 28, 28, 28, 28, 28, 28]
      "CAMERA_RAW_SIZE":
        [[3840, 2160], 
         [3840, 2160], 
         [1920, 1080], 
         [1920, 1080], 
         [1920, 1080], 
         [1920, 1080], 
         [1920, 1080]]
  
    build_gt:
      "max_objects": 256
      "od_heatmap_voxel_size": [0.64, 0.64]

    od_range:
      [-51.2, -30.72, -1.0, 102.4, 30.72, 5.0]

    Head:
      head1:
        head_type: SlotHead
        num_classes: 1
        inplanes: 128
        interplanes: 64
        scale_factor: 8
      dyn_od_head:
        fuser_config: 
          in_channels: 256
          out_channels: 128
        head_config: 
          in_channels: 128
          num_stages: 6
          out_channels: 21
          upsample: 8
        feature_fuser_config:
          in_channels: 512
          out_channels: 128
          block_num: 2
          attention_block_num: 0
          mlp_ratio: 3
          mlp_ratio_attn: 2
          act_layer: "nn.GELU"
          use_layer_scale: True
          layer_scale_init_value: 1e-5
          extra_act: False
          block_cls: "DWCB"
      
    Loss:
      od_range: [-51.2, -30.72, -1.0, 102.4, 30.72, 5.0]
      out_feat_voxel_size: [0.64, 0.64, 0.5]
    
    POST_PROCESSING:
      od_range: [-51.2, -30.72, -1.0, 102.4, 30.72, 5.0]
      RECALL_THRESH_LIST: [0.3, 0.5, 0.7]
      SCORE_THRESH: 0.28
      OUTPUT_RAW_SCORE: False
      EVAL_METRIC: "kitti"
      NMS_CONFIG: 
        MULTI_CLASSES_NMS: False
        NMS_TYPE: "nms_gpu"
        NMS_THRESH: 0.1
        NMS_PRE_MAXSIZE: 4096
        NMS_POST_MAXSIZE: 500
      DET_RANGE_LIST: [
        [-51.2, -30.72, -1.0, 102.4, 30.72, 5.0],
      ]
      IOU_THRESH_LIST: [0.5, 0.5, 0.25, 0.25]
      out_feat_voxel_size: [0.64, 0.64, 0.5]



    Evaluator: {}
    datasets:
      training:
      - { dataset_name: 'xxx', 
