model_parameters:
  onnx_model: '/code/workspace/fisheye_onnx/checkpoint/epoch=2-step=16000_checkpoint_sim.onnx'
  march: "nash-m"
  working_dir: '/code/workspace/bc/fisheye/'
  output_model_file_prefix: 'fisheye_int16'

input_parameters:
  input_name: "img_front_fisheye;img_right_fisheye;img_rear_fisheye;img_left_fisheye;fish_vt_grid;fish_prev_feats;fish_prev_feats_grid"
  input_type_rt: 'nv12;nv12;nv12;nv12;featuremap;featuremap;featuremap;'
  input_type_train: 'rgb;rgb;rgb;rgb;featuremap;featuremap;featuremap;'
  input_layout_train: 'NHWC;NHWC;NHWC;NHWC;NCHW;NCHW;NCHW;'
  input_shape: '1x512x960x3;1x512x960x3;1x512x960x3;1x512x960x3;4x192x60x2;1x128x48x60;1x48x60x2'
  norm_type: 'no_preprocess;no_preprocess;no_preprocess;no_preprocess;no_preprocess;no_preprocess;no_preprocess;'

calibration_parameters:
  cal_data_dir: '/code/workspace/calib_data/fisheye_200/img_front_fisheye;/code/workspace/calib_data/fisheye_200/img_right_fisheye;/code/workspace/calib_data/fisheye_200/img_rear_fisheye;/code/workspace/calib_data/fisheye_200/img_left_fisheye;/code/workspace/calib_data/fisheye_200/fish_vt_grid;/code/workspace/calib_data/fisheye_200/fish_prev_feats;/code/workspace/calib_data/fisheye_200/fish_prev_feats_grid'
  calibration_type: 'max'
  quant_config: {
    "model_config": {
      "all_node_type": int16,
      "model_output_type": int16,
    },
  }

compiler_parameters:
  optimize_level: 'O2'
  jobs: 64
  advice: 50
  extra_params: {"input_no_padding": True, "output_no_padding": True}
