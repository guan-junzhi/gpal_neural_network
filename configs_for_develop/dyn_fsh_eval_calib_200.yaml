Backbones:
  backbone0:
    ampfp16: true
    input_source:
    - img_front_fisheye
    - img_right_fisheye
    - img_rear_fisheye
    - img_left_fisheye
    load: all
    out_channels: 64
    type: EncoderRes18
Groups:
  group0:
    freeze: all
    input_source: backbone0
    load: all
    type: DummyBackbone
Necks:
  neck0:
    input_source: group0
    layers_config:
      conv_channels:
      - 128
      - 256
      - 512
      drop_smooth_conv: true
      out_channel: 128
      use_relu: true
    load: all
    type: Simple_FPN
Tasks:
  DRIVING_BEV_DYN:
    DEPLOY_CFG:
      mode: gpal30_in_model_with_small_image
    Evaluator: {}
    Head:
      dyn_od_head:
        fuser_config:
          in_channels: 256
          out_channels: 128
        head_config:
          HEAD:
            dim: 3
            height: 1
            hm: 6
            reg: 2
            rot: 6
            vel: 2
          feat_out_channels: 128
          in_channels: 128
          in_channels_list:
          - 64
          - 128
          - 256
          num_stages: 6
          out_channels: 21
          upsample: 8
      head1:
        head_type: SlotHead
        inplanes: 128
        interplanes: 64
        num_classes: 1
        scale_factor: 8
    Loss:
      od_range:
      - -19.2
      - -15.36
      - -1.0
      - 19.2
      - 15.36
      - 5.0
      out_feat_voxel_size:
      - 0.32
      - 0.32
      - 0.5
    POST_PROCESSING:
      DET_RANGE_LIST:
      - - -19.2
        - -15.36
        - -1.0
        - 19.2
        - 15.36
        - 5.0
      EVAL_METRIC: kitti
      IOU_THRESH_LIST:
      - 0.5
      - 0.5
      - 0.25
      - 0.25
      NMS_CONFIG:
        MULTI_CLASSES_NMS: false
        NMS_POST_MAXSIZE: 500
        NMS_PRE_MAXSIZE: 4096
        NMS_THRESH: 0.1
        NMS_TYPE: nms_gpu
      OUTPUT_RAW_SCORE: false
      RECALL_THRESH_LIST:
      - 0.3
      - 0.5
      - 0.7
      SCORE_THRESH: 0.23
      od_range:
      - -19.2
      - -15.36
      - -1.0
      - 19.2
      - 15.36
      - 5.0
      out_feat_voxel_size:
      - 0.32
      - 0.32
      - 0.5
    SWITCH_SUBTASK: DRIVING_BEV_DYN_FISHEYE
    USE_IGNORE_WEIGHT_MASK_CONFIG:
    - class_dict:
        6:
        - human_pedestrian
      ignore_range:
      - -1.5
      - -2.2
      - -1.0
      - 3.5
      - 2.2
      - 5.0
      vehicle_str: SKYWELL
    amp_scaler:
      backoff_factor: 0.99999
      growth_interval: 999999999
      init_scale: 128.0
      type: AMPScaler
    backbone: backbone0
    backbone_feat_id:
    - 2
    bev_channels: 256
    build_gt:
      max_objects: 256
      od_heatmap_voxel_size:
      - 0.32
      - 0.32
    cam_used:
    - ipm
    class_dict:
      1:
      - vehicle_car
      2:
      - vehicle_truck
      3:
      - vehicle_construction_vehicle
      4:
      - vehicle_cyclist
      5:
      - vehicle_tricycle
      6:
      - human_pedestrian
    datasets:
      training:
      - camera_name:
        - img_front_fisheye
        - img_right_fisheye
        - img_rear_fisheye
        - img_left_fisheye
        data_list:
