        shuffle: true
    frequency: 1.0
    grad_bounds: 3.0
    group: group0
    group_feat_id:
    - 1
    - 2
    - 3
    image_crop_config:
      CAMERA_RAW_SIZE:
      - - 1920
        - 1080
      - - 1920
        - 1080
      - - 1920
        - 1080
      - - 1920
        - 1080
      CROP_HeSai_ID4:
        CROP_START:
        - 0
        - 0
        - 0
        - 0
        SCALE:
        - 2.0
        - 2.0
        - 2.0
        - 2.0
      IMAGE_CROP_H_LEN: 512
      IMAGE_CROP_SIZE:
      - 512
      - 960
      IMAGE_RESIZE:
      - 540
      - 960
    load: all
    neck: neck0
    neck_feat_id:
    - 0
    od_range:
    - -19.2
    - -15.36
    - -1.0
    - 19.2
    - 15.36
    - 5.0
    transformer: transformer
    use_concat_dataset: true
    weight: 1.0
Test:
  visulization: true
Train:
  CLIP_LENGTH:
  - 5
  - 25
  EPOCH_LEN: 150000
  log_every: 10
  lr_scheduler:
    T_max: 40000
    after_scheduler: CosineAnnealingLR
    multiplier: 100
    type: GradualWarmupScheduler
    warmup_iterations: 50
  max_visu_img_num: 6
  optimizer:
    lr: 1.0e-06
    type: AdamW
    weight_decay: 1.0e-06
  visualize_every: 200
Transformer:
  load: all
  transformer_config:
    bev_map_range:
    - -19.2
    - -15.36
    - -1.0
    - 19.2
    - 15.36
    - 5.0
    bev_map_voxel_size:
    - 0.64
    - 0.64
    - 1.5
    image_down_div: 8
    in_channels: 128
    input_source:
    - img_front_fisheye
    - img_right_fisheye
    - img_rear_fisheye
    - img_left_fisheye
    out_channels: 128
    task_name: DRIVING_BEV_DYN
  type: ODViewTransformer
calib_data_save_path: workspace/calib_data/fisheye_200
check_val_every_n_epoch: 1000000
dump_calibset: true
has_label: true
image_per_gpu: 24
iteration_based_lr_schedulers: true
max_iterations: 40000
num_workers: 0
onnx_path: workspace/fisheye_onnx/checkpoint/epoch=2-step=16000_checkpoint_sim.onnx
save_every_n_iterations: 500
skip_sanity_check: true
workers_per_gpu: 0
