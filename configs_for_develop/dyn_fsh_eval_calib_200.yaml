        fast_buffer_path: ./fisheye
        have_prev_label: true
        image_dir: ./
        is_manual_label: false
        json_dir: od_occ_group/huiquyang/data/Obstacle_3DModelResult_ID4_new
        middle_json_str: 3d_detection_json
        root_dir: bev_park/PointLine_train/
        shuffle: false
      validation:
      - camera_name:
        - img_front_fisheye
        - img_right_fisheye
        - img_rear_fisheye
        - img_left_fisheye
        data_list:
        - description: L4 testing data
          pkl_path: od_occ_group/huiquyang/codes/456/val_fisheye_filtered_200.pkl
          tags:
          - L4
          - filtered-area
          use_ratio: -1
        dataset_name: xxx
        fast_buffer_path: ./buf_eval_origin_size_fisheye
        have_prev_label: false
        is_manual_label: true
        json_dir: od_occ_group/huiquyang/data/Obstacle_3DAnnotations_1107
