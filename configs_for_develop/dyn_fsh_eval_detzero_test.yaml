image_per_gpu: 24
workers_per_gpu: 0
skip_sanity_check: true
num_workers: 0
max_iterations: 40000
save_every_n_iterations: 500
iteration_based_lr_schedulers: true
check_val_every_n_epoch: 1000000
dump_calibset: false

Train:
  EPOCH_LEN: 150000
  CLIP_LENGTH: [5, 25]
  log_every: 10
  visualize_every: 200
  max_visu_img_num: 6
  optimizer: {type: AdamW, lr: 1.0e-06, weight_decay: 1.0e-06}
  lr_scheduler: {type: GradualWarmupScheduler, multiplier: 100, warmup_iterations: 50,
    after_scheduler: CosineAnnealingLR, T_max: 40000}

has_label: True

Test:
  visulization: True

Backbones:
  backbone0:
    type: EncoderRes18
    ampfp16: true
    load: all
    out_channels: 64
    input_source: ['img_front_fisheye', 'img_right_fisheye', 'img_rear_fisheye', 'img_left_fisheye']

Groups:
  group0: {load: all, freeze: all, type: DummyBackbone, input_source: backbone0}

Necks:
  neck0:
    type: Simple_FPN
    input_source: group0
    load: all
    layers_config:
      conv_channels: [128, 256, 512]
      out_channel: 128
      use_relu: true
      drop_smooth_conv: true

Transformer:
  type: ODViewTransformer
  load: all
  transformer_config:
    task_name: DRIVING_BEV_DYN
    bev_map_range: [-19.2, -15.36, -1.0, 19.2, 15.36, 5.0]
    bev_map_voxel_size: [0.64, 0.64, 1.5]
    image_down_div: 8
    input_source: ['img_front_fisheye', 'img_right_fisheye', 'img_rear_fisheye', 'img_left_fisheye']
    in_channels: 128
    out_channels: 128

Tasks:
  DRIVING_BEV_DYN:
    use_concat_dataset: true
    SWITCH_SUBTASK: DRIVING_BEV_DYN_FISHEYE
    DEPLOY_CFG:
     mode: "gpal30_in_model_with_small_image"
    USE_IGNORE_WEIGHT_MASK_CONFIG: [{vehicle_str: 'SKYWELL', class_dict: {6: [human_pedestrian]}, ignore_range: [-1.5, -2.2, -1.0, 3.5, 2.2, 5.0]}]
    load: all
    amp_scaler: {type: AMPScaler, init_scale: 128.0, growth_interval: 999999999, backoff_factor: 0.99999}
    cam_used: ['ipm']
    transformer: transformer
    frequency: 1.0
    grad_bounds: 3.0
    weight: 1.0
    backbone_feat_id: [2]
    group_feat_id: [1, 2, 3]
    neck_feat_id: [0]
    backbone: backbone0
    group: group0
    neck: neck0
    bev_channels: 256
    class_dict:
        1: [vehicle_car]
        2: [vehicle_truck]
        3: [vehicle_construction_vehicle]
        4: [vehicle_cyclist]
        5: [vehicle_tricycle]
        6: [human_pedestrian]

    image_crop_config:
      "IMAGE_RESIZE": [540, 960]
      "IMAGE_CROP_H_LEN": 512
      "IMAGE_CROP_SIZE": [512, 960]
      "CROP_HeSai_ID4":
        "SCALE": [2.0, 2.0, 2.0, 2.0]
        "CROP_START": [0, 0, 0, 0]
      "CAMERA_RAW_SIZE":
        [[1920, 1080],
         [1920, 1080],
         [1920, 1080],
         [1920, 1080]]
    build_gt:
      "max_objects": 256
      "od_heatmap_voxel_size": [0.32, 0.32]

    od_range:
      [-19.2, -15.36, -1.0, 19.2, 15.36, 5.0]

    Head:
      head1:
        head_type: SlotHead
        num_classes: 1
        inplanes: 128
        interplanes: 64
        scale_factor: 8
      dyn_od_head:
        fuser_config:
          in_channels: 256
          out_channels: 128
        head_config:
          in_channels: 128
          num_stages: 6
          out_channels: 21
          upsample: 8
          HEAD:
            hm: 6
            reg: 2
            height: 1
            dim: 3
            rot: 6
            vel: 2
          in_channels_list: [64, 128, 256]
          feat_out_channels: 128

    Loss:
      od_range: [-19.2, -15.36, -1.0, 19.2, 15.36, 5.0]
      out_feat_voxel_size: [0.32, 0.32, 0.5]

    POST_PROCESSING:
      od_range: [-19.2, -15.36, -1.0, 19.2, 15.36, 5.0]
      RECALL_THRESH_LIST: [0.3, 0.5, 0.7]
      SCORE_THRESH: 0.23
      OUTPUT_RAW_SCORE: False
      EVAL_METRIC: "kitti"
      NMS_CONFIG:
        MULTI_CLASSES_NMS: False
        NMS_TYPE: "nms_gpu"
        NMS_THRESH: 0.1
        NMS_PRE_MAXSIZE: 4096
        NMS_POST_MAXSIZE: 500
      DET_RANGE_LIST: [
        [-19.2, -15.36, -1.0, 19.2, 15.36, 5.0],
      ]
      IOU_THRESH_LIST: [0.5, 0.5, 0.25, 0.25]
      out_feat_voxel_size: [0.32, 0.32, 0.5]

    Evaluator: {}
    datasets:
      training:
      - { dataset_name: 'xxx',
          is_manual_label: false,
          have_prev_label: true,
          image_dir: "./",
          json_dir: "od_occ_group/huiquyang/data/Obstacle_3DModelResult_ID4_new",
          middle_json_str: "3d_detection_json",
          root_dir: "bev_park/PointLine_train/",
          data_list: [],
          camera_name: ['img_front_fisheye', 'img_right_fisheye', 'img_rear_fisheye', 'img_left_fisheye'],
          shuffle: False,
          fast_buffer_path: "./fisheye"
        }

      validation:
      - { dataset_name: 'xxx',
          is_manual_label: false,
          have_prev_label: false,
          json_dir: "od_occ_group/huiquyang/data/Obstacle_3DModelResult_detzero_test",
          middle_json_str: "3d_detection_json",
          root_dir: "bev_park/PointLineData_Test/",
          data_list:[
            {
              description: "detzero-test",
              pkl_path: "od_occ_group/huiquyang/codes/456/val_detzero_test.pkl",
              use_ratio: -1,
              tags: ["detzero-test"]
            },
          ],
          camera_name: ['img_front_fisheye', 'img_right_fisheye', 'img_rear_fisheye', 'img_left_fisheye'],
          shuffle: False,
          fast_buffer_path: "./buf_eval_origin_size_fisheye"
        }
