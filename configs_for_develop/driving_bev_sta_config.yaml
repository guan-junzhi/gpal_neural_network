image_per_gpu: 32
workers_per_gpu: 12
skip_sanity_check: true
max_iterations: 60000
save_every_n_iterations: 200
iteration_based_lr_schedulers: true
check_val_every_n_epoch: 1000000
dump_calibset: false

Train:
  log_every: 1
  visualize_every: 10
  max_visu_img_num: 10
  optimizer: {type: AdamW, lr: 5.0e-07, weight_decay: 1.0e-06}
  lr_scheduler: {type: GradualWarmupScheduler, multiplier: 100, warmup_iterations: 50,
    after_scheduler: CosineAnnealingLR, T_max: 30000}

Backbones:
  backbone0:
    type: ResNet
    # ampfp16: true
    load: all
    # freeze: bn
    input_source: ['img_front_30', 'img_front_120', 'img_left_front']
    num_layers: 18
    need_neck: False
  
Groups:
  group0: {load: all, freeze: all, type: DummyBackbone, input_source: backbone0}

Necks:
  neck0: {load: all, freeze: all, type: DummyNeck, input_source: group0}

Transformer:
  type: SingleBevFormerViewTransformer
  load: all
  # freeze: all
  transformer_config:
    task_name: DRIVING_BEV_STA
    pc_range: [0, -16, -2.0, 96.0, 16.0, 2.0]
    num_points_in_pillar: 4
    bev_y: 30
    bev_x: 75
    embed_dims: 256
    queue_length: 1
    max_camoverlap_num: 2
    numcam: 3
    single_bev: true
    use_lidar2img: false

    grid_length: [1.3333, 1.0]  # [bev_x, bev_y]
    start_x: 96
    start_y: 16
    crop_w_size: 0
    crop_h_size: 168
    image_w_size: 360
    image_h_size: 640
    
Tasks:
  DRIVING_BEV_STA:
    # batch_size: 12
    # num_worker_limit: 2
    use_concat_dataset: true
    load: all
    amp_scaler: {type: AMPScaler, init_scale: 128.0, growth_interval: 999999999, backoff_factor: 0.99999}
    cam_used: ['img_front_30', 'img_front_120', 'img_left_front']
    transformer: transformer
    frequency: 1.0
    grad_bounds: 3.0
    weight: 1.0
    backbone_feat_id: [2]
    group_feat_id: [1, 2, 3]
    neck_feat_id: [0]
    pc_range: [0, -16, -2.0, 96.0, 16.0, 2.0]

    
    Head:
      head1:
        head_type: MapInstanceDetectorHead
        layers_config:
          compatible_with_MVLane_loss: True
          in_channels: 256
          num_cam: 3
          bev_w: 75  # bev_x
          bev_h: 30  # bev_y
          head_embed_dims: 512
          num_vec_one2one: 50
          num_vec_one2many: 0  # 300
          k_one2many: 0
          fixed_ptsnum_per_pred_line: 20
          fixed_ptsnum_per_gt_line: 20
          num_cls: 2
          decoder_num_layers: 6
          decoder_num_heads: 8

    Evaluator: {}
    datasets:
      training:
      - { dataset_name: 'gpal', 
          # root_dir:  "../lane_data",
          root_dir:  "/data/dp_group/process-prod-bucket/data_collect",
          pkl_infos: "gpal_songbiao_no_stop_20250604",
          pkl_root: "/data/ai_group/datasets/multiview_lane_det/lane_pkl/",
          in_shape: [360, 640],
          camera_name: ['img_front_30', 'img_front_120', 'img_left_front'],
          gt_range: [96, 16, 0, 0.0024000000000086175, -16.0, 0],
          is_random_scale_and_translate: true,
          fast_buffer_path: "/data/ai_group/workdirs/multitask_lanenet_group/sikong/train_buf/"

        }
      validation:
      - {dataset_name: dummy, camera_name: camera_front_wide, root_dir: "root"}